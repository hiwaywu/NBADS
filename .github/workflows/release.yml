name: release

# Publishes a GitHub Release with the app in it. Two ways in:
#
#   - Actions -> release -> Run workflow, with the tag to create (e.g. v2.11):
#     tags main's head and releases it
#   - push a version tag yourself: releases that tag
#
# Attached:
#   - NBAHub.apk           releases/NBAHub.apk at that commit
#   - NBAHub.exe,          carried over from the previous release: both are built
#     NBAHub-portable.zip  on Windows only, so attach new ones by hand when they change
# Title and notes: releases/notes/<tag>.md (first line = title), else the tag's message.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag to create and release'
        required: true
        default: 'v2.11'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          title="$TAG"
          : > notes.md
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
            title=$(git tag -l --format='%(contents:subject)' "$TAG")
            git tag -l --format='%(contents:body)' "$TAG" > notes.md
            where=(--verify-tag)
          else
            where=(--target "$GITHUB_SHA")      # the release creates the tag
          fi
          if [ -f "releases/notes/$TAG.md" ]; then
            title=$(head -n 1 "releases/notes/$TAG.md")
            tail -n +2 "releases/notes/$TAG.md" > notes.md
          fi

          mkdir carry
          prev=$(gh release view --json tagName -q .tagName 2>/dev/null || true)
          if [ -n "$prev" ] && [ "$prev" != "$TAG" ]; then
            gh release download "$prev" --dir carry --pattern NBAHub.exe --pattern NBAHub-portable.zip || true
          fi
          shopt -s nullglob
          carried=(carry/*)
          echo "carried over from ${prev:-nothing}: ${carried[*]:-none}"

          gh release create "$TAG" releases/NBAHub.apk "${carried[@]}" \
            "${where[@]}" --title "${title:-$TAG}" --notes-file notes.md
